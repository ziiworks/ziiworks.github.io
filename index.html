.banner{height:clamp(220px,60vw,340px);background:linear-gradient(135deg,#444,#bbb 50%,#222) center/cover;position:relative}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,var(--bg) 100%)}
.circ{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.78);display:grid;place-items:center;z-index:3;transition:transform .35s var(--spring)}
.circ:active{transform:scale(.86)}
#gear{left:16px}#share{right:16px}
.head{padding:0 20px;margin-top:calc(var(--P)*-1.08);position:relative;z-index:2}
.av{width:var(--P);height:var(--P);position:relative;margin-bottom:calc(var(--P)*.4)}
.av .ph{position:absolute;width:calc(var(--P)*1.03);height:calc(var(--P)*1.03);left:calc(var(--P)*-.015);top:calc(var(--P)*-.015);border-radius:50%;background:linear-gradient(160deg,#c9b6a3,#4a3a30) center/cover}
.av .fr{position:absolute;width:calc(var(--P)*var(--k)*var(--fs,1));left:calc(var(--P)*(.5 - var(--k)*var(--fs,1)*var(--cx) + var(--fx,0)));top:calc(var(--P)*(.5 - var(--k)*var(--fs,1)*var(--cy) + var(--fy,0)));max-width:none;transition:opacity .3s}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.vf[hidden]{display:none}

.user{color:var(--dim);font-size:19px}
.chip{display:inline-block;font:italic 600 12px inherit;border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin-top:6px;color:#ddd}
.pill{border:1px solid #fff;background:none;border-radius:99px;padding:8px 20px;font-size:15px;transition:transform .35s var(--spring)}
.pill:active{transform:scale(.92)}
.soc{display:flex;gap:14px;margin:30px 0 0;min-height:30px}
.bio{font-size:19px;margin:24px 0 12px}
.stats{display:flex;gap:20px;color:var(--dim);font-size:15px;flex-wrap:wrap}.stats b{color:#fff}
.tabs{position:relative;display:flex;margin:26px 20px;border:1px solid var(--line);border-radius:99px;padding:4px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tabs i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:99px;background:var(--blue);transition:transform .5s var(--spring);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tabs button{flex:1;background:none;border:0;padding:11px 0;font-weight:700;position:relative}
section[hidden]{display:none}
.sec{animation:in .5s var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.cat{display:flex;align-items:center;gap:10px;padding:0 20px;margin:20px 0 12px}
.cat b{border:1px solid var(--line);border-radius:99px;padding:6px 18px;font-size:15px}
.cat span{color:var(--dim);font-weight:700;font-size:14px}
.scroll{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.card{flex:none;width:36%;min-width:130px;aspect-ratio:3/4;border-radius:16px;scroll-snap-align:start;position:relative;overflow:hidden;transition:transform .35s var(--spring)}
.card:active{transform:scale(.96)}
.card::after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.lk{display:flex;gap:7px;align-items:center;font-size:14px;background:none;border:0;padding:0}
.card .lk{position:absolute;left:12px;bottom:10px;z-index:1;font-size:12px;gap:5px}.card .lk .ic{--s:15px}
.lk .ic{color:#fff;transition:transform .45s var(--spring),color .2s}
.lk.on .ic{color:#e0102a;transform:scale(1.35)}
.tags{display:flex;gap:8px;padding:0 20px;margin-bottom:14px;flex-wrap:wrap}
.tags b{border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:14px}
.vid{margin:0 20px;height:clamp(190px,52vw,290px);border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,#111,#888 45%,#111);display:grid;place-items:center}
.vid .t{position:absolute;right:16px;bottom:12px;font-size:18px}
.vid .snd{position:absolute;left:14px;bottom:14px;opacity:.9}
.vid .play{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;padding-left:4px;font-size:22px;transition:transform .35s var(--spring)}
.vid:active .play{transform:scale(.86)}
.vbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;font-weight:700}
.vbar .lk{font-size:15px;font-weight:400}.vbar .lk .ic{--s:20px}.vbar .sell{display:flex;gap:8px;align-items:center}
.cap{padding:0 20px}.cap p{margin:2px 0;color:var(--dim)}
.about{padding:0 20px}.about h2{font-size:30px;margin:10px 0 14px}.about p{font-size:18px;max-width:32ch;white-space:pre-wrap}
.sc2{display:flex;gap:22px;align-items:center}.sc2 a{display:flex;gap:10px;align-items:center;color:#fff;text-decoration:none;font-style:italic}
.fab{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:3px solid #fff;background:var(--blue);font-size:46px;line-height:1;place-items:center;z-index:5;box-shadow:0 10px 30px rgba(43,154,240,.5);transition:transform .4s var(--spring);display:none;padding:0 0 5px}
.fab:active{transform:translateX(-50%) scale(.86)}
body.me .fab{display:grid}
.only-me{display:none!important}body.me .only-me{display:grid!important}body.me .pill.only-me{display:inline-block!important}
.mode{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;font-size:12px;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:99px;padding:8px 12px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 14px 30px;-webkit-user-select:auto;user-select:auto}
.ov.open{display:block}
.sheet{max-width:520px;margin:0 auto;border-radius:28px;border:1px solid var(--line);background:rgba(40,40,40,.72);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);padding:22px;text-align:center;animation:in .5s var(--spring)}
.sheet .av{--P:96px;margin:30px auto calc(var(--P)*.55)}
.sheet label.f{display:block;text-align:left;margin:14px 0 6px;font-size:16px}
.sheet input:not([type=file]),.sheet textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;color:#fff;font:inherit;padding:10px 12px;outline:none}
.sheet input:focus,.sheet textarea:focus{border-color:var(--blue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.tg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;margin:8px 0}
.tg button{border:0;background:none;padding:4px 14px;border-radius:99px;font-size:14px;transition:background .3s}
.tg button.on{background:var(--blue)}
.frames{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.frames button{aspect-ratio:1;border-radius:50%;border:0;background:rgba(255,255,255,.07);padding:4px;transition:transform .35s var(--spring);display:grid;place-items:center;font-size:11px;color:var(--dim)}
.frames button:active{transform:scale(.88)}
.frames button.sel{outline:2px solid var(--blue);outline-offset:2px}
.frames img{width:100%;height:100%;object-fit:contain}
.foot{text-align:center;margin-top:30px}.foot button{background:none;border:0;color:rgba(255,255,255,.35);font-size:13px;padding:10px 20px}
.del{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);font-size:14px;place-items:center}
.sell{color:#fff;text-decoration:none}
.sellb{position:absolute;right:10px;bottom:9px;z-index:2;display:flex;gap:5px;align-items:center;font-size:11px;font-weight:700;color:#fff;text-decoration:none;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:99px;padding:4px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.sellb .ic{--s:13px}
.vw{margin-bottom:36px}.empty{text-align:center;color:var(--dim);padding:30px 20px}
.wm{position:absolute;right:12px;top:10px;font-size:12px;opacity:.55;pointer-events:none;text-shadow:0 1px 3px #000}
.meta{color:var(--dim);font-size:13px;margin:4px 0 8px;word-break:break-all}
input[type=range]{width:100%;accent-color:var(--blue)}
#adj label span{float:right;color:var(--dim)}
.acts{display:flex;gap:10px;justify-content:center;margin-top:18px}
.pill.pri{background:var(--blue);border-color:var(--blue);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <section id="s2" class="sec" hidden></section>

    <label class="f" for="uc">Kategori</label><input id="uc" list="cl" placeholder="Sketch, Posters, mograph…"><datalist id="cl"></datalist>
    <label class="f" for="ut">Judul</label><input id="ut">
    <label class="f" for="ucap">Caption</label><textarea id="ucap" rows="2"></textarea>
    <div style="margin-top:14px"><b>For sell</b></div><div class="tg" id="us"><button class="on" data-v="0">Tidak</button><button data-v="1">Ya</button></div>
    <input id="usell" type="url" placeholder="Link tujuan, contoh https://…" hidden>
  </div>
  <div class="acts"><button class="pill" id="ucancel">Batal</button><button class="pill pri" id="usave">Posting</button></div></div></div>
<div class="ov" id="viewer" style="padding:0;background:rgba(0,0,0,.92)"><div id="vimg" style="position:absolute;inset:0;background:center/contain no-repeat"></div><a id="vsell" class="pill" hidden target="_blank" rel="noopener noreferrer" style="position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:var(--blue);border-color:var(--blue);color:#fff;text-decoration:none;font-weight:700">For sell</a></div>
<footer class="foot"><button id="lg">Masuk</button></footer>
<div class="ov" id="lov"><div class="sheet" style="max-width:380px"><h3 style="margin:0 0 6px">Masuk pemilik</h3>
  <label class="f" for="lE">Email</label><input id="lE" type="email" autocomplete="username">
  <label class="f" for="lP">Password</label><input id="lP" type="password" autocomplete="current-password">
  <p id="lerr" style="color:#ff6b6b;min-height:20px;margin:10px 0 0"></p>
  <div class="acts"><button class="pill" id="lcancel">Batal</button><button class="pill pri" id="lgo">Masuk</button></div></div></div>

<div class="ov" id="ov"><div class="sheet">
  <div class="av" id="av2"><div class="ph" id="ph2"></div><img class="fr" id="fr2" alt=""></div>
  <label class="pill" style="display:inline-block">Ubah foto profil<input type="file" id="fAv" accept="image/*" hidden></label>
  <label class="pill" style="display:inline-block">Ubah banner<input type="file" id="fBn" accept="image/*" hidden></label>
  <div style="margin-top:14px"><b>Verified</b></div>
  <div class="tg" id="tg"><button class="on" data-v="1">ON</button><button data-v="0">OFF</button></div>
  <label class="f" for="iBio">Bio</label><textarea id="iBio" rows="2"></textarea>
  <div class="g2"><div><label class="f" for="iDn">Nama display</label><input id="iDn"></div><div><label class="f" for="iUn">Username</label><input id="iUn"></div>
  <div><label class="f" for="iJob">Pekerjaan</label><input id="iJob"></div><div><label class="f" for="iBd">Ulang tahun</label><input id="iBd" placeholder="DD/MM"></div></div>
  <label class="f" for="iL1">Link</label><input id="iL1" placeholder="https://instagram.com/…">

    <label class="f" for="rS">Ukuran frame <span id="vS"></span></label><input type="range" id="rS" min="50" max="130" step="1">
    <label class="f" for="rX">Geser kiri / kanan <span id="vX"></span></label><input type="range" id="rX" min="-30" max="30" step="1">
    <label class="f" for="rY">Geser atas / bawah <span id="vY"></span></label><input type="range" id="rY" min="-30" max="30" step="1">
    <div style="text-align:center;margin-top:12px"><button class="pill" id="rst">Reset posisi</button></div>
  </div>
  <div class="acts"><button class="pill" id="cancel">Batal</button><button class="pill pri" id="save">Simpan</button></div>
</div></div>

function mark(c){const x=c.getContext("2d"),s=Math.max(14,c.width*.035);x.font=`600 ${s}px sans-serif`;x.textAlign="right";x.textBaseline="bottom";x.fillStyle="rgba(255,255,255,.7)";x.shadowColor="rgba(0,0,0,.6)";x.shadowBlur=s*.25;x.fillText(S.un.startsWith("@")?S.un:"@"+S.un,c.width-s*.6,c.height-s*.5)}
const img2blob=(f,max)=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);mark(c);c.toBlob(b=>b?res(b):rej(new Error("Gagal memproses foto")),"image/jpeg",.88)};i.onerror=()=>rej(new Error("Format foto tidak didukung, coba JPG atau PNG"));i.src=URL.createObjectURL(f)});
const vthumb=f=>new Promise(res=>{const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=URL.createObjectURL(f);v.onloadedmetadata=()=>{v.currentTime=Math.min(.5,(v.duration||1)/2)};v.onseeked=()=>{const s=Math.min(1,640/v.videoWidth),c=document.createElement("canvas");c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext("2d").drawImage(v,0,0,c.width,c.height);mark(c);c.toBlob(b=>res({b,d:v.duration}),"image/jpeg",.8)};v.onerror=()=>res({b:null,d:0});setTimeout(()=>res({b:null,d:v.duration||0}),15000)});
async function put(path,blob,type){const {error}=await SB.storage.from("media").upload(path,blob,{contentType:type,cacheControl:"31536000"});if(error)throw error;return path}
const likeH=w=>`<button class="lk ${liked.has(w.id)?"on":""}" data-id="${w.id}"><i class="ic i-like"></i><span>${fmt(w.like_count)}</span></button>`;
const delH=w=>`<button class="del only-me" data-del="${w.id}" aria-label="Hapus">✕</button>`;
const sellB=w=>w.for_sell&&w.sell_url?`<a class="sellb" href="${esc(w.sell_url)}" target="_blank" rel="noopener noreferrer"><i class="ic i-for"></i>For sell</a>`:"";
const cardH=w=>`<div class="card" data-id="${w.id}" style="background:url(${pub(w.thumb_path||w.media_path)}) center/cover #222">${delH(w)}${likeH(w)}${sellB(w)}</div>`;
const vidH=w=>`<div class="vw"><div class="tags"><b>${esc(w.category||"Video")}</b></div><div class="vid" data-v="${w.id}" style="background:url(${pub(w.thumb_path)}) center/cover #111"><div class="play">▶</div><i class="ic i-sound snd" style="--s:26px"></i><span class="t">${esc(w.duration)}</span><span class="wm">${esc(S.un)}</span>${delH(w)}</div><div class="vbar">${likeH(w)}${w.for_sell?(w.sell_url?`<a class="sell" href="${esc(w.sell_url)}" target="_blank" rel="noopener noreferrer">For sell <i class="ic i-for" style="--s:24px"></i></a>`:'<span class="sell">For sell <i class="ic i-for" style="--s:24px"></i></span>'):""}</div><div class="cap"><b style="font-size:20px">${esc(w.title)}</b><p>${esc(w.caption)}</p></div></div>`;
function renderWorks(){
  const ph=W.filter(w=>w.kind==="photo"),vd=W.filter(w=>w.kind==="video"),cats=[...new Set(ph.map(w=>w.category||"Lainnya"))];
  $("s1").innerHTML=cats.length?cats.map(c=>`<div class="cat"><b>${esc(c)}</b></div><div class="scroll">${ph.filter(w=>(w.category||"Lainnya")===c).map(cardH).join("")}</div>`).join(""):'<p class="empty">Belum ada foto.</p>';
  $("s2").innerHTML=vd.length?vd.map(vidH).join(""):'<p class="empty">Belum ada video.</p>';
  $("cl").innerHTML=[...new Set(W.map(w=>w.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
  $("nwork").textContent=W.length;$("nlike").textContent=fmt(W.reduce((a,w)=>a+(w.like_count||0),0));
}
async function loadWorks(){const {data}=await SB.from("works").select("*").order("created_at",{ascending:false});W=data||[];renderWorks()}
async function likeIt(l){
  const id=l.dataset.id,w=W.find(x=>x.id===id);if(!w||!SB)return;
  const on=!liked.has(id);on?liked.add(id):liked.delete(id);
  const paint=n=>document.querySelectorAll(`.lk[data-id="${id}"]`).forEach(b=>{b.classList.toggle("on",liked.has(id));b.querySelector("span").textContent=fmt(n)});
  paint(Math.max(0,w.like_count+(on?1:-1)));
  const {data,error}=await tmo(SB.rpc("toggle_like",{p_work:id,p_device:dev}),15000).catch(e=>({error:e}));
  if(error){on?liked.delete(id):liked.add(id);paint(w.like_count);return}
  w.like_count=data;paint(data);ls.set("liked",JSON.stringify([...liked]));renderWorks();
}
function playVid(v){const w=W.find(x=>x.id===v.dataset.v);v.removeAttribute("data-v");v.innerHTML=`<video src="${pub(w.media_path)}" poster="${pub(w.thumb_path)}" controls autoplay playsinline controlsList="nodownload noremoteplayback" disablePictureInPicture oncontextmenu="return false" style="width:100%;height:100%;object-fit:contain;background:#000"></video><span class="wm">${esc(S.un)}</span>`}
async function delWork(id){const w=W.find(x=>x.id===id),{error}=await SB.from("works").delete().eq("id",id);if(error)return alert("Gagal menghapus: "+error.message);SB.storage.from("media").remove([w.media_path,w.thumb_path].filter(Boolean));W=W.filter(x=>x.id!==id);renderWorks()}
document.body.addEventListener("click",async e=>{
  if(e.target.closest("a"))return;
  const d=e.target.closest("[data-del]");if(d){if(confirm("Hapus karya ini?"))delWork(d.dataset.del);return}
  const l=e.target.closest(".lk[data-id]");if(l){likeIt(l);return}
  const v=e.target.closest(".vid[data-v]");if(v){playVid(v);return}
  const c=e.target.closest(".card[data-id]");if(c){const w=W.find(x=>x.id===c.dataset.id);$("vimg").style.backgroundImage=`url(${pub(w.media_path)})`;const vs=$("vsell");vs.hidden=!(w.for_sell&&w.sell_url);if(!vs.hidden)vs.href=w.sell_url;$("viewer").classList.add("open")}
});
$("vsell").onclick=e=>e.stopPropagation();
$("viewer").onclick=()=>$("viewer").classList.remove("open");
$("fab").onclick=()=>{["uc","ut","ucap","usell"].forEach(i=>$(i).value="");$("uab").value=S.ab;setUK(UK);$("uov").classList.add("open")};
$("ucancel").onclick=()=>$("uov").classList.remove("open");
function setUK(k){UK=k;document.querySelectorAll("#uk button").forEach(x=>x.classList.toggle("on",x.dataset.k===k));$("uabout").hidden=k!=="about";$("umedia").hidden=k==="about";$("uf").accept=k==="video"?"video/*":"image/*";UF=null;$("uf").value="";$("ufn").textContent="";$("usave").textContent=k==="about"?"Simpan":"Posting"}
$("uk").onclick=e=>{const b=e.target.closest("button");if(b)setUK(b.dataset.k)};
$("us").onclick=e=>{const b=e.target.closest("button");if(!b)return;US=+b.dataset.v;$("usell").hidden=!US;document.querySelectorAll("#us button").forEach(x=>x.classList.toggle("on",x===b))};
$("uf").onchange=e=>{UF=e.target.files[0]||null;$("ufn").textContent=UF?UF.name:""};
$("usave").onclick=async()=>{
  if(UK==="about"){const b=$("usave");b.disabled=true;b.textContent="Menyimpan…";try{const v=$("uab").value,{data,error}=await tmo(SB.from("profile").update({about:v,updated_at:new Date().toISOString()}).eq("id",1).select());if(error)throw error;if(!data||!data.length)throw new Error("Belum login sebagai pemilik");S.ab=v;render();$("uov").classList.remove("open")}catch(e){alert("Gagal menyimpan: "+(e.message||e))}b.disabled=false;b.textContent="Simpan";return}
  const su=$("usell").value.trim();if(US&&!/^https?:\/\/\S+$/i.test(su))return alert("Isi link tujuan For sell yang diawali https://");
  if(!UF)return alert("Pilih file dulu");
  if(UK==="video"&&UF.size>50*1024*1024)return alert("Video maksimal 50 MB (batas paket gratis Supabase)");
  const b=$("usave");b.disabled=true;b.textContent="Mengunggah…";
  try{
    const id=Date.now()+"-"+Math.random().toString(36).slice(2,7),row={kind:UK,category:$("uc").value.trim(),title:$("ut").value.trim(),caption:$("ucap").value.trim(),for_sell:!!US,sell_url:US?su:null};
    if(UK==="photo"){
      const big=await img2blob(UF,1600),small=await img2blob(UF,480);
      row.media_path=await tmo(put(`works/${id}.jpg`,big,"image/jpeg"),120000);
      row.thumb_path=await tmo(put(`works/${id}-t.jpg`,small,"image/jpeg"),60000);
    }else{
      const t=await vthumb(UF);row.duration=fdur(t.d);
      const ext=(UF.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"")||"mp4";
      row.media_path=await tmo(put(`works/${id}.${ext}`,UF,UF.type||"video/mp4"),300000);
      if(t.b)row.thumb_path=await tmo(put(`works/${id}-t.jpg`,t.b,"image/jpeg"),60000);
    }
    const {data,error}=await tmo(SB.from("works").insert(row).select().single());
    if(error)throw error;
    W.unshift(data);renderWorks();$("uov").classList.remove("open");
  }catch(e){alert("Gagal posting: "+(e.message||e))}
  b.disabled=false;b.textContent="Posting";
};
const MINVIS=100;
async function track(){const {data}=await SB.rpc("track_visit",{p_device:dev});if(typeof data==="number"){$("nvis").textContent=fmt(data);$("pvis").hidden=data<MINVIS}}
sync();render();setTab(1);renderWorks();
if(SB){SB.auth.onAuthStateChange((ev,s)=>{document.body.classList.toggle("me",!!s);$("lg").textContent=s?"Keluar":"Masuk"});load();loadWorks();track()}
</script>
</body>
</html>
